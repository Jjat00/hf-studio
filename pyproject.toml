[project]
name = "hf-studio"
version = "0.1.0"
description = "Self-hosted AI video, image and audio studio on the Higgsfield and ElevenLabs APIs: REST API, MCP server and web UI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jaime Jjat", email = "userjjat00@gmail.com" }]
keywords = ["mcp", "mcp-server", "higgsfield", "elevenlabs", "ai-video", "text-to-video", "generative-ai", "claude-code", "codex"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "anthropic>=1.11.0",
    "edge-tts>=7.2.8",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "mcp>=1.2",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.0.54",
    "uvicorn[standard]>=0.53.0",
]

[project.urls]
Repository = "https://github.com/Jjat00/hf-studio"

[project.scripts]
hf-studio = "hf_studio.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hf_studio"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.8",
]
